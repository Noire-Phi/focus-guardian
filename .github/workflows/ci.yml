# Checks every push and pull request: formatting, lint, types and tests.
# The same commands work locally: npm run format:check, lint, typecheck, test.
name: CI

on:
  push:
  pull_request:

# Read-only: CI only checks code, it never writes to the repository
permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
